<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0b0a0f;
    font-family: 'DM Sans', sans-serif;
    color: #f5f0e6;
  }
  .geo {
    position: absolute; right: -100px; top: -150px; width: 720px; height: 720px;
    opacity: 0.12;
  }
  .geo circle { fill: none; stroke: #c4956a; stroke-width: 0.5; }
  .copy { position: absolute; left: 96px; top: 146px; }
  .name {
    font-size: 21px; letter-spacing: 0.32em; text-transform: uppercase; color: #a8a39b;
    margin: 0 0 40px;
  }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: 66px; line-height: 1.09; margin: 0; max-width: 820px;
  }
  h1 em { font-style: italic; }
  .gold { color: #c4956a; }
  .teal { color: #3ea691; }
  .violet { color: #9b8bd0; }
  .url {
    font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; margin-top: 46px; color: #f5f0e6;
  }
  .url em { font-style: italic; color: #c4956a; }
</style>
</head>
<body>
  <svg class="geo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="70" r="30"/>
    <circle cx="125.98" cy="85" r="30"/>
    <circle cx="125.98" cy="115" r="30"/>
    <circle cx="100" cy="130" r="30"/>
    <circle cx="74.02" cy="115" r="30"/>
    <circle cx="74.02" cy="85" r="30"/>
    <circle cx="100" cy="100" r="60" stroke-width="0.4" opacity="0.5"/>
    <circle cx="100" cy="100" r="90" stroke-width="0.3" opacity="0.35"/>
  </svg>
  <div class="copy">
    <p class="name">James Bolden</p>
    <h1>Building the spaces where<br><em class="gold">consciousness</em>, <em class="teal">community</em>, and<br><em class="violet">living systems</em> meet.</h1>
    <div class="url">james<em>.today</em></div>
  </div>
</body>
</html>
